name: Deploy GitHub Pages and Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: khcvfklaafyuzafunwtf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ثبت نشده یا فرمت آن نادرست است؛ توکن باید با sbp_ شروع شود."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD ثبت نشده است."
            exit 1
          fi
          if ! supabase projects list --output json >/dev/null; then
            echo "::error::Access Token معتبر نیست یا به پروژه Supabase دسترسی ندارد. یک توکن تازه از همان حساب پروژه بسازید."
            exit 1
          fi
      - name: Link Supabase project
        run: supabase link --project-ref khcvfklaafyuzafunwtf --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migration
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy secure API function
        run: supabase functions deploy office-api --project-ref khcvfklaafyuzafunwtf

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
