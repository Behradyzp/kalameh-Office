name: Build cPanel Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cpanel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - run: npm ci
      - name: Validate PHP backend
        run: find cpanel-server -name '*.php' -print -exec php -l {} \;
      - run: npm run build:cpanel
      - uses: actions/upload-artifact@v4
        with:
          name: kalameh-office-cpanel
          path: cpanel-package/
          if-no-files-found: error
          retention-days: 30
