name: Deploy GitHub Pages and Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'khcvfklaafyuzafunwtf' }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_G2VDsop7ZRV2ihG4skz5mw_6OEUCFsC' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ثبت نشده یا فرمت آن نادرست است؛ توکن باید با sbp_ شروع شود."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_ID" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::یکی از Secretهای الزامی Supabase ثبت نشده است."
            exit 1
          fi
          if ! supabase projects list --output json >/dev/null; then
            echo "::error::Access Token معتبر نیست یا به پروژه Supabase دسترسی ندارد. یک توکن تازه از همان حساب پروژه بسازید."
            exit 1
          fi
      - name: Apply all database migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          for migration in supabase/migrations/*.sql; do
            psql \
              --host=aws-0-ap-southeast-2.pooler.supabase.com \
              --port=5432 \
              --username="postgres.${SUPABASE_PROJECT_ID}" \
              --dbname=postgres \
              --set=ON_ERROR_STOP=1 \
              --file="$migration"
          done
      - name: Deploy secure API function
        run: supabase functions deploy office-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify database backup and atomic revision
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          psql \
            --host=aws-0-ap-southeast-2.pooler.supabase.com \
            --port=5432 \
            --username="postgres.${SUPABASE_PROJECT_ID}" \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.workspace_backups (workspace_id, data)
            select id, data from public.workspace_state where id = 'main';
          update public.workspace_state
            set revision = revision + 1
            where id = 'main';
          do $$
          begin
            if not exists (select 1 from public.workspace_backups where workspace_id = 'main') then
              raise exception 'Backup verification failed';
            end if;
            if not exists (select 1 from public.workspace_state where id = 'main' and revision >= 1) then
              raise exception 'Revision verification failed';
            end if;
          end $$;
          rollback;
          SQL
      - name: Verify deployed API authentication
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"action":"session"}' \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/office-api")
          test "$status" = "401"

  pages:
    needs: supabase
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
